version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/mtproto"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories: ["/", "/mtproto", "/mihomo"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
