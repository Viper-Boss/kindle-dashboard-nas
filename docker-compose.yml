services:
  kindle-dashboard:
    stop_grace_period: 30s
    image: nas-kindle-dashboard-security:local
    build: .
    container_name: kindle-dashboard
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "12m"
        max-file: "2"
    depends_on:
      mihomo:
        condition: service_healthy
    ports:
    - ${NAS_BIND_IP:-192.168.120.200}:8787:8787/tcp
    env_file:
    - .env
    environment:
      TZ: Asia/Shanghai
      PORT: '8787'
      DASHBOARD_WIDTH: '600'
      DASHBOARD_HEIGHT: '800'
      CACHE_SECONDS: '300'
    volumes:
    - ./data:/data
    - ./proxy:/proxy
    - ./app.py:/app/app.py:ro
    - ./proxy_admin.py:/app/proxy_admin.py:ro
    - ./admin_ui.py:/app/admin_ui.py:ro
    - ./admin_extensions.py:/app/admin_extensions.py:ro
    - ./management.py:/app/management.py:ro
    - ./maintenance.py:/app/maintenance.py:ro
    - ./traffic_stats.py:/app/traffic_stats.py:ro
    - ./web_auth.py:/app/web_auth.py:ro
    - ./service_watchdog.py:/app/service_watchdog.py:ro
  mihomo:
    image: nas-mihomo-security:local
    build: ./mihomo
    container_name: kindle-dashboard-proxy
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "12m"
        max-file: "2"
    command:
    - -f
    - /root/.config/mihomo/config.yaml
    healthcheck:
      test:
      - CMD
      - /healthcheck
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    volumes:
    - ./proxy:/root/.config/mihomo
    ports:
    - ${NAS_BIND_IP:-192.168.120.200}:7890:7890/tcp
    - ${NAS_BIND_IP:-192.168.120.200}:7891:7891/tcp
    - ${NAS_BIND_IP:-192.168.120.200}:7891:7891/udp
    - ${NAS_BIND_IP:-192.168.120.200}:7892:7892/tcp
  mtproto:
    image: nas-mtproto-security:local
    container_name: nas-mtproto
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "12m"
        max-file: "2"
    working_dir: /app
    depends_on:
      mihomo:
        condition: service_healthy
    ports:
    - ${NAS_BIND_IP:-192.168.120.200}:8443:8443/tcp
    - ${WHATSAPP_BIND_IP:-0.0.0.0}:5222:5222/tcp
    - "${WHATSAPP_IPV6_BIND_IP:-[::]}:5222:5222/tcp"
    - ${WHATSAPP_BIND_IP:-0.0.0.0}:7777:7777/tcp
    - "${WHATSAPP_IPV6_BIND_IP:-[::]}:7777:7777/tcp"
    volumes:
    - ./mtproto:/app:ro
    - ./proxy:/proxy:ro
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    environment:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    command:
    - python
    - mtprotoproxy.py
    - config.py
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; socket.create_connection(("127.0.0.1",8443),2).close()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    build:
      context: ./mtproto
