mixed-port: 7890
port: 7892
socks-port: 7891
allow-lan: true
bind-address: "*"
external-controller: 0.0.0.0:9090
secret: CONTROLLER_SECRET
lan-allowed-ips:
  - 192.168.0.0/16
  - 172.16.0.0/12
  - 127.0.0.0/8
mode: rule
log-level: warning
profile:
  store-selected: true
proxy-groups:
  - name: 数据屏代理
    type: select
    proxies: [DIRECT]
  - name: WhatsApp代理
    type: select
    proxies: [数据屏代理]
  - name: Telegram代理
    type: select
    proxies: [数据屏代理]
rules:
  - DOMAIN-SUFFIX,telegram.org,Telegram代理
  - DOMAIN-SUFFIX,t.me,Telegram代理
  - DOMAIN-SUFFIX,telegram.me,Telegram代理
  - IP-CIDR,91.105.192.0/23,Telegram代理,no-resolve
  - IP-CIDR,91.108.4.0/22,Telegram代理,no-resolve
  - IP-CIDR,91.108.8.0/22,Telegram代理,no-resolve
  - IP-CIDR,91.108.12.0/22,Telegram代理,no-resolve
  - IP-CIDR,91.108.16.0/22,Telegram代理,no-resolve
  - IP-CIDR,91.108.20.0/22,Telegram代理,no-resolve
  - IP-CIDR,91.108.56.0/22,Telegram代理,no-resolve
  - IP-CIDR,149.154.160.0/20,Telegram代理,no-resolve
  - IP-CIDR,185.76.151.0/24,Telegram代理,no-resolve
  - IP-CIDR6,2001:67c:4e8::/48,Telegram代理,no-resolve
  - IP-CIDR6,2001:b28:f23c::/48,Telegram代理,no-resolve
  - IP-CIDR6,2001:b28:f23d::/48,Telegram代理,no-resolve
  - IP-CIDR6,2001:b28:f23f::/48,Telegram代理,no-resolve
  - IP-CIDR6,2a0a:f280::/32,Telegram代理,no-resolve
  - DOMAIN-SUFFIX,whatsapp.net,WhatsApp代理
  - MATCH,数据屏代理
