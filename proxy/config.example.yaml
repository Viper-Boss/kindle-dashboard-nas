mixed-port: 7890
port: 7892
socks-port: 7891
allow-lan: true
bind-address: "*"
external-controller: 0.0.0.0:9090
secret: CONTROLLER_SECRET
lan-allowed-ips:
  - 192.168.0.0/16
  - 172.16.0.0/12
  - 127.0.0.0/8
mode: rule
log-level: warning
profile:
  store-selected: true
proxy-groups:
  - name: 数据屏代理
    type: select
    proxies: [DIRECT]
  - name: WhatsApp代理
    type: select
    proxies: [数据屏代理]
rules:
  - DOMAIN-SUFFIX,whatsapp.net,WhatsApp代理
  - MATCH,数据屏代理
